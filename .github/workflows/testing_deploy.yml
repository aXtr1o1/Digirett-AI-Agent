name: CI/CD Deploy to AWS EC2 on Testing Branch v1.0

on: 
  push:
    branches:
      - Testing
      # - staging
      # - Frontend
      # - Backend
      # - Ingestion
  pull_request:
    branches:
      - Testing
      #- staging
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python for Backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Backend - Install Dependencies
        run: |
          python -m pip install -r requirements.txt
          pip show pytest || pip install pytest
      - name: Backend - Unit Tests
        run: |
          cd backend
          python -m pytest
      - name: Ingestion - Install Dependecies
        run: |
          python -m pip install -r requirements.txt
          
      - name: Ingestion - Run unit Tests
        run: |
          cd ingestion
          python -m pytest
      - name:  Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Frontend- Install dependencies
        run: |
          cd frontend/digirett-frontend
          npm install
      - name: Frontend - Run unit tests
        run: |
          cd frontend/digirett-frontend
          npm test -- --watch=false --passWithNoTests
      
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    environment: EC2_HOST
    if: github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Verify deploy secrets
      run: |
        if [ -z "${{ secrets.EC2_HOST }}" ]; then echo "::error::Secret EC2_HOST is not set."; exit 1; fi
        if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then echo "::error::Secret EC2_SSH_KEY is not set."; exit 1; fi
        echo "Required secrets are set."

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          set -ex
          whoami
          pwd
          cd /home/ubuntu/Digirett-AI-Agent
          git reset --hard
          git checkout Testing
          echo "Pulling latest code..."
          git fetch origin
          git pull origin Testing 

          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          echo "Installing dependencies..."
          pip install -r requirements.txt
          

          sudo systemctl daemon-reload
          sudo systemctl enable digirett-backend
          sudo systemctl restart digirett-backend
          echo "✅ Backend deployed successfully"
          deactivate

          # ── FRONTEND deployment ───────────────────────────────
          cd /home/ubuntu/Digirett-AI-Agent/frontend/digirett-frontend
          npm ci --prefer-offline --no-audit || npm install
          npm run build   # produces ./dist or ./build folder

          sudo systemctl daemon-reload
          sudo systemctl enable digirett-frontend
          sudo systemctl restart digirett-frontend
          echo "✅ Frontend deployed successfully"



