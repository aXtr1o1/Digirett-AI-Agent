name: CI/CD Deploy to AWS EC2

on: 
  push:
    branches:
      - Testing
  pull_request:
    branches:
      - Testing
  
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python for Backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Backend - Install Dependencies
        run: |
          cd backend
          python -m pip install -r requirements.txt
          pip show pytest || pip install pytest
      - name: Backend - Unit Tests
        run: |
          cd backend
          python -m pytest
          
      - name: Ingestion - Install Dependecies
        run: |
          cd ingestion
          python -m pip install -r requirements.txt
      - name: Ingestion - Run unit Tests
        run: |
          cd ingestion
          python -m pytest
      - name:  Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Frontend- Install dependencies
        run: |
          cd frontend
          npm install
      - name: Frontend - Run unit tests
        run: |
          cd frontend
          npm test -- --watch=false
      
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    environment: EC2_HOST
    if: github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        timeout: 30s
        command_timeout: 10m
        script: |
          cd /var/www/app/Digirett-AI-Agent
    
          echo "Pulling latest code..."
          git pull origin Production
    
          echo "Installing dependencies..."
          pip3 install -r requirements.txt
    
          echo "Restarting service..."
          sudo systemctl restart app
         
