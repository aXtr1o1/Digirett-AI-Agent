name: CI/CD Deploy to AWS EC2

on:
  push:   # Run on push to ANY branch
    branches:
      - '**'

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python for Backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend - Install Dependencies
        run: |
          cd backend
          python -m pip install -r requirements.txt
          pip install pytest

      - name: Backend - Unit Tests
        run: |
          cd backend
          python -m pytest
          
      - name: Ingestion - Install Dependencies
        run: |
          cd ingestion
          python -m pip install -r requirements.txt

      - name: Ingestion - Run Unit Tests
        run: |
          cd ingestion
          python -m pytest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Frontend - Install dependencies
        run: |
          cd frontend/digirett-frontend
          npm install

      - name: Frontend - Run unit tests
        run: |
          cd frontend/digirett-frontend
          npm test -- --watch=false

  deploy:
    needs: tests
    runs-on: ubuntu-latest

    # 🚀 Only deploy if branch is Testing
    if: github.ref == 'refs/heads/Testing'

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/app/Digirett-AI-Agent
            
            echo "Resetting to Testing branch..."
            git fetch origin
            git reset --hard origin/Testing
            
            echo "Installing backend dependencies..."
            cd backend
            pip3 install -r requirements.txt
            
            echo "Restarting service..."
            sudo systemctl restart app

            echo "Deployment completed successfully!"
