name: CI/CD Deploy to AWS EC2

on: 
  push:
    branches:
      - Testing
      - staging
      - Frontend
      - Backend
      - Ingestion
  pull_request:
    branches:
      - Testing
      - staging
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python for Backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Backend - Install Dependencies
        run: |
          python -m pip install -r requirements.txt   
          pip show pytest || pip install pytest
      - name: Backend - Unit Tests
        run: |
          cd backend
          python -m pytest
          
      - name: Ingestion - Install Dependecies
        run: |
          python -m pip install -r requirements.txt
      - name: Ingestion - Run unit Tests
        run: |
          cd ingestion
          python -m pytest
      - name:  Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Frontend- Install dependencies
        run: |
          cd frontend/digirett-frontend
          npm install
      - name: Frontend - Run unit tests
        run: |
          cd frontend/digirett-frontend
          npm test -- --watch=false