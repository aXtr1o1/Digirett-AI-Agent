<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}Digirett Notification{% endblock %}</title>
</head>
<body style="font-family: sans-serif; background-color: #f7fafc; margin: 0; padding: 20px;">
    <div style="font-family: sans-serif; max-width: 600px; margin: auto; padding: 20px; border: 1px solid #eee; background-color: #ffffff; border-radius: 8px;">
        <h2 style="color: #2D3748; margin-top: 0;">{% block header %}Welcome to Digirett{% endblock %}</h2>
        {% block content %}{% endblock %}
        <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0;">
        <p style="font-size: 0.8em; color: #A0AEC0; margin-bottom: 0;">
            This email was sent by the Digirett AI Platform Team.
        </p>
    </div>
</body>
</html>
